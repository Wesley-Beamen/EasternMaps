<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Navigator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>School Navigator</h1>

        <p class="subtitle">
            Location Detection Test
        </p>

        <button id="locationButton">
            Find My Location
        </button>

        <div id="status">
            Location has not been requested.
        </div>

        <div class="location-card">

            <div class="location-item">
                <span>Latitude</span>
                <strong id="latitude">--</strong>
            </div>

            <div class="location-item">
                <span>Longitude</span>
                <strong id="longitude">--</strong>
            </div>

            <div class="location-item">
                <span>Accuracy</span>
                <strong id="accuracy">--</strong>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
