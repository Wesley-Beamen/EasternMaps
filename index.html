<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Navigator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f1f5f9;
            color: #475569;
            font-size: 14px;
        }

        .location-card {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .location-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .location-item span {
            color: #64748b;
        }

        .location-item strong {
            color: #111827;
        }

        #pathOutput {
            margin-top: 25px;
            padding: 15px;
            background: #e2e8f0;
            border-radius: 10px;
            color: #1e293b;
            font-size: 15px;
            text-align: left;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>School Navigator</h1>

        <p class="subtitle">Location Detection Test</p>

        <button id="locationButton">Find My Location</button>

        <div id="status">Location has not been requested.</div>

        <div class="location-card">
            <div class="location-item">
                <span>Latitude</span>
                <strong id="latitude">--</strong>
            </div>

            <div class="location-item">
                <span>Longitude</span>
                <strong id="longitude">--</strong>
            </div>

            <div class="location-item">
                <span>Accuracy</span>
                <strong id="accuracy">--</strong>
            </div>
        </div>

        <button id="pathButton">Compute Shortest Path</button>

        <div id="pathOutput"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
