<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Navigator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        #pathOutput {
            margin-top: 25px;
            padding: 15px;
            background: #e2e8f0;
            border-radius: 10px;
            color: #1e293b;
            font-size: 15px;
            text-align: left;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>School Navigator</h1>
        <p class="subtitle">Shortest Path Calculator</p>

        <button id="pathButton">Compute Shortest Path</button>

        <div id="pathOutput"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
