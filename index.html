<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>School Pathfinding</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
      }
      h1 {
        margin-bottom: 20px;
      }
      .controls {
        background: #1f2937;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 320px;
      }
      select, button {
        padding: 8px 10px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
      }
      select {
        background: #111827;
        color: #e5e7eb;
      }
      button {
        background: #2563eb;
        color: #e5e7eb;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background: #1d4ed8;
      }
      #pathOutput {
        margin-top: 20px;
        background: #111827;
        padding: 15px;
        border-radius: 10px;
        display: none;
        max-width: 500px;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Eastern Regional Pathfinding</h1>

    <div class="controls">
      <label for="startRoom">Start location:</label>
      <select id="startRoom">
        <option value="108">Room 108</option>
        <option value="101">Room 101</option>
        <option value="100_start">100 Hallway Start</option>
        <option value="100_end">100 Hallway End</option>
        <option value="200_start">200 Hallway Start</option>
        <option value="200_end">200 Hallway End</option>
        <option value="media_center">Media Center</option>
        <option value="room_205">Room 205</option>
      </select>

      <label for="endRoom">End location:</label>
      <select id="endRoom">
        <option value="108">Room 108</option>
        <option value="101">Room 101</option>
        <option value="100_start">100 Hallway Start</option>
        <option value="100_end">100 Hallway End</option>
        <option value="200_start">200 Hallway Start</option>
        <option value="200_end">200 Hallway End</option>
        <option value="media_center">Media Center</option>
        <option value="room_205">Room 205</option>
      </select>

      <button id="pathButton">Compute Path</button>
    </div>

    <div id="pathOutput"></div>

    <script src="script.js"></script>
  </body>
</html>
